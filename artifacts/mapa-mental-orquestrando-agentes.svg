<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 2020 2240" width="2020" height="2240"><rect x="-40" y="-40" width="2020" height="2240" fill="#fcfcfa"/><rect x="0" y="0" width="1940" height="200" rx="12" fill="#f3edfb" stroke="#7256a0" stroke-width="2"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">ROTEIRO DE ESTUDO DO APRESENTADOR</text><text x="24" y="68" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Orquestrando Agentes de IA · BuscaGames</text><text x="24" y="96" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">39 perguntas reais do jogo, em 8 blocos de estudo.</text><text x="24" y="124" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Cada linha liga: o que ensinar → o que o quiz cobra.</text><text x="24" y="152" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Contém alternativas e gabarito: use para preparação, não para projetar durante o quiz.</text><rect x="0" y="250" width="1940" height="200" rx="12" fill="#fff3e5" stroke="#a06b28" stroke-width="2"/><text x="24" y="290" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">CORREÇÃO NECESSÁRIA ANTES DE INICIAR O JOGO</text><text x="24" y="318" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O jogo está no slide 31; “Por onde começar?” depende do slide 32.</text><text x="24" y="346" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Ensine o conteúdo do slide 32 antes de abrir o jogo e depois retome o exercício do slide 31.</text><text x="24" y="374" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O banco é embaralhado por guilda: atualmente não há filtro por bloco já apresentado.</text><text x="24" y="402" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Conclua todos os conteúdos cobrados antes de jogar. Este arquivo não altera o jogo nem os slides.</text><rect x="0" y="500" width="1940" height="228" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="540" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">COMO USAR ESTE ROTEIRO</text><text x="24" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">1. Abra as páginas 01 a 08 no seletor de páginas do tldraw.</text><text x="24" y="596" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">2. Leia a coluna ENSINAR; use a explicação e a demonstração sugeridas na sua fala.</text><text x="24" y="624" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">3. Cubra a coluna QUIZ e tente responder antes de conferir o gabarito.</text><text x="24" y="652" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">4. Só cobre uma pergunta depois de ensinar explicitamente o conhecimento necessário.</text><text x="24" y="680" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Detalhes que o mapa anterior omitiu: 90,2% / ~15× / 80%; comando Git; governança; origem do ADR; cobrança datada.</text><rect x="0" y="810" width="940" height="240" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="850" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">01 · Contexto, harness e panorama</text><text x="24" y="878" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">4 perguntas · página 01</text><text x="24" y="906" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">contexto · harness · codex-plataforma · kiro</text><rect x="1000" y="810" width="940" height="240" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="1024" y="850" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">02 · Workflows e multiagente</text><text x="1024" y="878" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">7 perguntas · página 02</text><text x="1024" y="906" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">workflow · orchestrator · evaluator · multiagente · browsecomp · lider ·</text><text x="1024" y="934" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">isolation</text><rect x="0" y="1080" width="940" height="240" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="1120" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">03 · Configurar e escolher agentes</text><text x="24" y="1148" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">5 perguntas · página 03</text><text x="24" y="1176" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">subagent-description · tool-scope · isolation-frontmatter · simples-primeiro ·</text><text x="24" y="1204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">second-harness</text><rect x="1000" y="1080" width="940" height="240" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="1024" y="1120" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">04 · Worktrees na prática</text><text x="1024" y="1148" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">4 perguntas · página 04</text><text x="1024" y="1176" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">worktree-shares · worktree-add · worktree-gap · worktree-limit</text><rect x="0" y="1350" width="940" height="240" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="24" y="1390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">05 · Contratos e memória</text><text x="24" y="1418" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">7 perguntas · página 05</text><text x="24" y="1446" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">agents-md · agents-md-governanca · agents-md-tamanho · adr-shape · adr-radar ·</text><text x="24" y="1474" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">adr-agents · estado-compartilhado</text><rect x="1000" y="1350" width="940" height="240" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="1024" y="1390" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">06 · Case BuscaGames</text><text x="1024" y="1418" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">5 perguntas · página 06</text><text x="1024" y="1446" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">dois-harnesses-case · fluxo · decisao-incidente · incident · tacit</text><rect x="0" y="1620" width="940" height="240" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="24" y="1660" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">07 · Autonomia e risco</text><text x="24" y="1688" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">4 perguntas · página 07</text><text x="24" y="1716" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">tipos-de-risco · autonomy · contratos-operacionais · checklist</text><rect x="1000" y="1620" width="940" height="240" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="1024" y="1660" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">08 · Custos e aplicação antes do jogo</text><text x="1024" y="1688" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">3 perguntas · página 08</text><text x="1024" y="1716" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">cost · codex-token · primeiro-passo</text><rect x="0" y="1940" width="1940" height="200" rx="12" fill="#fff3e5" stroke="#a06b28" stroke-width="2"/><text x="24" y="1980" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">PONTOS PARA REFORÇAR OU VALIDAR NA FALA</text><text x="24" y="2008" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Worktree não é sandbox: explicite a separação entre arquivos, coordenação e permissões (slides 10 + 15).</text><text x="24" y="2036" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Retirar Write/Edit não impede toda escrita se Bash continua disponível; explique o escopo real (slide 10).</text><text x="24" y="2064" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Codex como plataforma e mudança de cobrança são afirmações datadas do HTML, não verificações externas deste roteiro.</text><text x="24" y="2092" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O banco tem apoio nos slides/notas, mas conteúdo escrito não garante que tenha sido ensinado oralmente.</text></svg>