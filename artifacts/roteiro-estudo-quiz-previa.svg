<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 2020 2084" width="2020" height="2084"><rect x="-40" y="-40" width="2020" height="2084" fill="#fcfcfa"/><rect x="0" y="0" width="1940" height="144" rx="12" fill="#f3edfb" stroke="#7256a0" stroke-width="2"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">01 · Contexto, harness e panorama</text><text x="24" y="68" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Preparação do apresentador · 4 perguntas · respostas extraídas do banco do jogo</text><text x="24" y="96" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Leia de cima para baixo: ensine o conceito à esquerda e confira a cobrança à direita.</text><rect x="0" y="190" width="840" height="368" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="230" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">ENSINAR 01 · Contexto</text><text x="24" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Apoio: slide(s) 03</text><text x="24" y="286" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="314" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Explique que a sessão acumula leitura de arquivos, testes, erros e</text><text x="24" y="342" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">decisões. Compactar reduz o volume, mas pode perder o motivo de</text><text x="24" y="370" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">uma decisão. O problema cobrado é a preservação do contexto, não</text><text x="24" y="398" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">esquecer uma linguagem.</text><text x="24" y="426" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">NA FALA / DEMONSTRAÇÃO</text><text x="24" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Exemplo para a fala: depois de várias tentativas, o resumo mantém</text><text x="24" y="510" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">a solução, mas omite por que uma alternativa foi descartada.</text><rect x="960" y="190" width="980" height="396" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="984" y="230" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">QUIZ 01 · ID: contexto</text><text x="984" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Por que uma sessão longa vira gargalo?</text><text x="984" y="286" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="314" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">A. O modelo esquece a linguagem do projeto</text><text x="984" y="342" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">B. A compactação pode apagar a decisão por trás do código</text><text x="984" y="370" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">C. A janela de contexto reduz a velocidade de resposta</text><text x="984" y="398" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="426" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">GABARITO: B — A compactação pode apagar a decisão por trás do código</text><text x="984" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">POR QUÊ (EXPLICAÇÃO DO JOGO)</text><text x="984" y="510" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Leitura de arquivo, testes e stack traces enchem a janela. A compactação reduz</text><text x="984" y="538" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">volume, mas pode levar junto o contexto que justificou decisões anteriores.</text><rect x="0" y="656" width="840" height="368" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="696" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">ENSINAR 02 · Harness</text><text x="24" y="724" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Apoio: slide(s) 04</text><text x="24" y="752" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="780" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Separe modelo de harness. O modelo escolhe ou produz respostas; o</text><text x="24" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">harness monta contexto, executa ferramentas, aplica sandbox e</text><text x="24" y="836" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">aprovações e mantém o estado entre turnos. Não é treinamento com o</text><text x="24" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">repositório.</text><text x="24" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="920" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">NA FALA / DEMONSTRAÇÃO</text><text x="24" y="948" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Percorra o fluxo do slide em voz alta: contexto → modelo →</text><text x="24" y="976" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">ferramentas → sandbox/aprovação → estado.</text><rect x="960" y="656" width="980" height="396" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="984" y="696" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">QUIZ 02 · ID: harness</text><text x="984" y="724" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O que o harness faz, além de chamar o modelo?</text><text x="984" y="752" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="780" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">A. Treina o modelo com os arquivos do repositório</text><text x="984" y="808" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">B. Monta contexto, roda ferramentas, aplica sandbox e estado</text><text x="984" y="836" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">C. Troca de fornecedor quando o modelo erra</text><text x="984" y="864" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="892" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">GABARITO: B — Monta contexto, roda ferramentas, aplica sandbox e estado</text><text x="984" y="920" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="948" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">POR QUÊ (EXPLICAÇÃO DO JOGO)</text><text x="984" y="976" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O harness é a camada que faz o modelo trabalhar: contexto, modelo, ferramentas,</text><text x="984" y="1004" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">sandbox e aprovação, estado entre turnos.</text><rect x="0" y="1122" width="840" height="396" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="1162" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">ENSINAR 03 · Panorama</text><text x="24" y="1190" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Apoio: slide(s) 04–05</text><text x="24" y="1218" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="1246" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O material atribui ao Codex a publicação do harness como</text><text x="24" y="1274" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">plataforma aberta e situa essa apresentação em agosto de 2026.</text><text x="24" y="1302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Diga explicitamente o nome da ferramenta: a pergunta exige essa</text><text x="24" y="1330" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">associação.</text><text x="24" y="1358" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="1386" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">NA FALA / DEMONSTRAÇÃO</text><text x="24" y="1414" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Ponto factual do documento-base. Confirme a referência e a data</text><text x="24" y="1442" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">antes de cobrar; não é uma conclusão dedutível apenas da definição</text><text x="24" y="1470" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">de harness.</text><rect x="960" y="1122" width="980" height="396" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="984" y="1162" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">QUIZ 03 · ID: codex-plataforma</text><text x="984" y="1190" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Qual ferramenta publicou o harness como plataforma aberta?</text><text x="984" y="1218" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1246" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">A. Cursor</text><text x="984" y="1274" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">B. Kiro</text><text x="984" y="1302" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">C. Codex</text><text x="984" y="1330" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1358" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">GABARITO: C — Codex</text><text x="984" y="1386" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1414" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">POR QUÊ (EXPLICAÇÃO DO JOGO)</text><text x="984" y="1442" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Em agosto de 2026 a OpenAI apresentou o Codex como plataforma e tratou o harness</text><text x="984" y="1470" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">como uma camada reutilizável do sistema.</text><rect x="0" y="1588" width="840" height="368" rx="12" fill="#edf3ff" stroke="#365d9e" stroke-width="2"/><text x="24" y="1628" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">ENSINAR 04 · Panorama</text><text x="24" y="1656" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Apoio: slide(s) 05</text><text x="24" y="1684" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="1712" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Compare os pontos de partida: Kiro é apresentado como AWS,</text><text x="24" y="1740" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">spec-first e steering files em .kiro/steering. OpenCode é o</text><text x="24" y="1768" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">descrito como MIT, model-agnostic e self-hosted. Cursor é o</text><text x="24" y="1796" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">associado ao editor.</text><text x="24" y="1824" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="24" y="1852" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">NA FALA / DEMONSTRAÇÃO</text><text x="24" y="1880" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">Peça à turma para associar cada descrição à ferramenta; só listar</text><text x="24" y="1908" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">os nomes não prepara para as alternativas.</text><rect x="960" y="1588" width="980" height="396" rx="12" fill="#ecf6ef" stroke="#34734c" stroke-width="2"/><text x="984" y="1628" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#202632">QUIZ 04 · ID: kiro</text><text x="984" y="1656" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">O que caracteriza o Kiro no panorama de 2026?</text><text x="984" y="1684" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1712" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">A. Abordagem spec-first, com steering files em .kiro/steering</text><text x="984" y="1740" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">B. É MIT, model-agnostic e self-hosted</text><text x="984" y="1768" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">C. O agente vive dentro do editor</text><text x="984" y="1796" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1824" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">GABARITO: A — Abordagem spec-first, com steering files em .kiro/steering</text><text x="984" y="1852" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632"></text><text x="984" y="1880" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">POR QUÊ (EXPLICAÇÃO DO JOGO)</text><text x="984" y="1908" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">OpenCode é o MIT, model-agnostic e self-hosted; o Cursor é o que põe o agente</text><text x="984" y="1936" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#202632">dentro da IDE. O Kiro, da AWS, parte de especificações.</text></svg>