<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122334">
  <title>Agent Arena — A Cidadela dos Agentes</title>
  <style>
    @font-face{font-family:Lilita;src:url('./assets/fonts/LilitaOne.ttf')}@font-face{font-family:Nunito;src:url('./assets/fonts/Nunito.ttf');font-weight:200 1000}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#152c3c}body{background:radial-gradient(ellipse at 68% 40%,#366173 0%,#193749 45%,#0b192b 100%);font-family:Nunito,sans-serif}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#world{pointer-events:none}#game{touch-action:none;outline:none}
    /* Only accessibility and native text entry use DOM. Every visible control is painted in Canvas. */
    .sr-only,#text-entry{position:fixed;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:.01;left:0;top:0;border:0;padding:0;font-size:16px}
  </style>
  <script type="importmap">{"imports":{"three":"./assets/vendor/three.module.js"}}</script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <canvas id="game" tabindex="0" role="application" aria-label="Agent Arena. Use Tab para navegar e Enter para selecionar. Selecione cartas com 1 a 4 e aplique nas construções usando Tab e Enter."></canvas>
  <input id="text-entry" class="sr-only" autocomplete="off" maxlength="22" aria-label="Entrada de texto do jogo">
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="accessible-controls" class="sr-only"></div>
  <script type="module" src="./dist/client/main.js"></script>
</body>
</html>
